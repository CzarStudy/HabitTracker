
<style>
  :root { --accent: #1D9E75; --accent-light: #E1F5EE; --warn: #BA7517; --warn-light: #FAEEDA; --danger: #A32D2D; --danger-light: #FCEBEB; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .tracker { padding: 1rem 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
  .week-nav { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--color-text-secondary); }
  .week-nav button { background: none; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--color-text-primary); }
  .week-nav button:hover { background: var(--color-background-secondary); }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
  .stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .section-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-secondary); margin: 1.25rem 0 8px; }
  .habit-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .habit-row:last-child { border-bottom: none; }
  .habit-emoji { font-size: 16px; width: 24px; text-align: center; }
  .habit-name { flex: 1; font-size: 14px; color: var(--color-text-primary); }
  .days-grid { display: flex; gap: 5px; }
  .day-btn { width: 30px; height: 30px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); cursor: pointer; font-size: 10px; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; flex-direction: column; transition: all 0.15s; }
  .day-btn:hover { border-color: var(--color-border-secondary); background: var(--color-background-secondary); }
  .day-btn.done { background: #E1F5EE; border-color: #1D9E75; color: #0F6E56; }
  .day-btn.done .check { display: block; }
  .day-btn .day-label { font-size: 9px; }
  .streak-badge { font-size: 11px; background: #FAEEDA; color: #854F0B; border-radius: 20px; padding: 2px 8px; min-width: 36px; text-align: center; }
  .add-btn { margin-top: 1rem; width: 100%; padding: 10px; background: none; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); color: var(--color-text-secondary); font-size: 13px; cursor: pointer; }
  .add-btn:hover { background: var(--color-background-secondary); }
  .prog-bar-wrap { height: 6px; background: var(--color-background-secondary); border-radius: 99px; margin-top: 1rem; overflow: hidden; }
  .prog-bar { height: 100%; background: #1D9E75; border-radius: 99px; transition: width 0.3s; }
  .today-indicator { font-size: 9px; font-weight: 500; color: #1D9E75; margin-top: 1px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; width: 320px; max-width: 90vw; }
  .modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
  .modal input, .modal select { width: 100%; padding: 8px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 14px; margin-bottom: 10px; background: var(--color-background-primary); color: var(--color-text-primary); }
  .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
  .modal-btns button { flex: 1; padding: 8px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); cursor: pointer; font-size: 13px; }
  .btn-confirm { background: #E1F5EE; color: #0F6E56; border-color: #1D9E75 !important; }
  .btn-cancel { background: none; color: var(--color-text-secondary); }
</style>

<div class="tracker">
  <h2 class="sr-only">Habit tracker semanal con seguimiento de hábitos personales y escolares</h2>
  <div class="top-bar">
    <div style="font-size: 16px; font-weight: 500; color: var(--color-text-primary);" id="week-label"></div>
    <div class="week-nav">
      <button onclick="changeWeek(-1)">&#8592;</button>
      <button onclick="goToday()">hoy</button>
      <button onclick="changeWeek(1)">&#8594;</button>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
  <div style="font-size: 12px; color: var(--color-text-secondary); margin-top: 4px;" id="prog-label"></div>

  <div id="habits-container"></div>

  <button class="add-btn" onclick="openModal()">+ agregar hábito</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>nuevo hábito</h3>
    <input id="new-name" placeholder="nombre del hábito" />
    <input id="new-emoji" placeholder="emoji (opcional, ej: 📚)" maxlength="2" />
    <select id="new-cat">
      <option value="personal">personal</option>
      <option value="escolar">escolar</option>
      <option value="salud">salud</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">cancelar</button>
      <button class="btn-confirm" onclick="addHabit()">agregar</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['D','L','M','X','J','V','S'];
const DAY_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const CATS = { personal: 'Personal', escolar: 'Escolar', salud: 'Salud' };

let weekOffset = 0;
let habits = JSON.parse(localStorage.getItem('habits_v2') || 'null') || [
  { id: 1, name: 'Estudiar / repasar apuntes', emoji: '📚', cat: 'escolar' },
  { id: 2, name: 'Hacer tareas pendientes', emoji: '✏️', cat: 'escolar' },
  { id: 3, name: 'Leer 20 minutos', emoji: '📖', cat: 'personal' },
  { id: 4, name: 'Hacer ejercicio', emoji: '💪', cat: 'salud' },
  { id: 5, name: 'Dormir a tiempo', emoji: '😴', cat: 'salud' },
  { id: 6, name: 'Sin procrastinar (día productivo)', emoji: '🎯', cat: 'personal' },
];
let done = JSON.parse(localStorage.getItem('done_v2') || '{}');

function save() {
  try { localStorage.setItem('habits_v2', JSON.stringify(habits)); localStorage.setItem('done_v2', JSON.stringify(done)); } catch(e){}
}

function getWeekDates(offset) {
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay();
  const monday = new Date(today); monday.setDate(today.getDate() - dow + (dow === 0 ? -6 : 1) + offset * 7);
  return Array.from({length:7}, (_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
}

function dateKey(d) { return d.toISOString().slice(0,10); }

function toggleDay(habitId, dateStr) {
  const k = habitId + '_' + dateStr;
  done[k] = !done[k];
  save(); render();
}

function streak(habitId) {
  let s = 0; const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<365;i++) { const d = new Date(today); d.setDate(today.getDate()-i); if(done[habitId+'_'+dateKey(d)]) s++; else break; }
  return s;
}

function render() {
  const today = new Date(); today.setHours(0,0,0,0);
  const dates = getWeekDates(weekOffset);
  const weekStart = dates[0], weekEnd = dates[6];
  document.getElementById('week-label').textContent =
    weekStart.toLocaleDateString('es-MX',{day:'numeric',month:'short'}) + ' – ' +
    weekEnd.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});

  let totalPossible = 0, totalDone = 0;
  dates.forEach(d => { if(d <= today) habits.forEach(h => { totalPossible++; if(done[h.id+'_'+dateKey(d)]) totalDone++; }); });
  const pct = totalPossible > 0 ? Math.round(totalDone/totalPossible*100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${totalDone} de ${totalPossible} hábitos completados esta semana (${pct}%)`;

  const todayDone = habits.filter(h => done[h.id+'_'+dateKey(today)]).length;
  const bestStreak = habits.reduce((m,h) => Math.max(m, streak(h.id)), 0);
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-label">hoy</div><div class="stat-value">${todayDone}/${habits.length}</div></div>
    <div class="stat-card"><div class="stat-label">semana %</div><div class="stat-value">${pct}%</div></div>
    <div class="stat-card"><div class="stat-label">mejor racha</div><div class="stat-value">${bestStreak}d</div></div>
    <div class="stat-card"><div class="stat-label">hábitos</div><div class="stat-value">${habits.length}</div></div>
  `;

  const container = document.getElementById('habits-container');
  const bycat = {};
  habits.forEach(h => { if(!bycat[h.cat]) bycat[h.cat] = []; bycat[h.cat].push(h); });

  container.innerHTML = Object.entries(bycat).map(([cat, hs]) => `
    <div class="section-title">${CATS[cat] || cat}</div>
    ${hs.map(h => {
      const s = streak(h.id);
      return `<div class="habit-row">
        <span class="habit-emoji">${h.emoji || '●'}</span>
        <span class="habit-name">${h.name}</span>
        <div class="days-grid">
          ${dates.map((d,i) => {
            const dk = dateKey(d);
            const isToday = d.getTime() === today.getTime();
            const isDone = !!done[h.id+'_'+dk];
            const isFuture = d > today;
            return `<button class="day-btn${isDone?' done':''}" onclick="toggleDay(${h.id},'${dk}')" ${isFuture?'disabled':''} title="${DAY_NAMES[i]} ${dk}">
              <span class="day-label">${DAYS[d.getDay()]}</span>
              ${isToday ? '<span class="today-indicator">hoy</span>' : ''}
              ${isDone ? '<span>✓</span>' : ''}
            </button>`;
          }).join('')}
        </div>
        <span class="streak-badge">${s > 0 ? '🔥'+s : '—'}</span>
        <button onclick="removeHabit(${h.id})" style="background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:16px;padding:4px;" title="eliminar">×</button>
      </div>`;
    }).join('')}
  `).join('');
}

function changeWeek(d) { weekOffset += d; render(); }
function goToday() { weekOffset = 0; render(); }

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function addHabit() {
  const name = document.getElementById('new-name').value.trim();
  if(!name) return;
  const emoji = document.getElementById('new-emoji').value.trim() || '●';
  const cat = document.getElementById('new-cat').value;
  const id = Date.now();
  habits.push({id, name, emoji, cat});
  save(); closeModal(); render();
  document.getElementById('new-name').value = '';
  document.getElementById('new-emoji').value = '';
}

function removeHabit(id) {
  if(confirm('¿Eliminar este hábito?')) { habits = habits.filter(h => h.id !== id); save(); render(); }
}

render();
</script>
